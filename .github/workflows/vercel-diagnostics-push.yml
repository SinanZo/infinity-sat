name: Vercel Diagnostics (Push)

on:
  push:
    branches:
      - 'run/vercel-diagnostics'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List Vercel teams
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "--- Vercel: Teams ---"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v1/teams | python3 -m json.tool || true

      - name: List Vercel projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "--- Vercel: Projects ---"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v1/projects | python3 -m json.tool || true

      - name: Find project by name
        run: |
          echo "--- Searching for project 'infinity-sat' ---"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v1/projects > projects.json || true
          python3 - <<'PY' || true
import json
data = json.load(open('projects.json'))
items = data.get('projects') or data.get('items') or data
for p in items:
    if p.get('name') == 'infinity-sat':
        print('FOUND_PROJECT_ID:', p.get('id'))
        print('project_obj:', {k: p.get(k) for k in ('id','name','orgId','teamId','team')})
        break
else:
    print('PROJECT_NOT_FOUND')
PY
